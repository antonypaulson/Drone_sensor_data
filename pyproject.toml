[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-sensor-data"
version = "0.1.0"
description = "EDA and visualizations for Zipline drone launch sensor data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter>=1.0"]

[project.scripts]
drone-sensor-data = "drone_sensor_data.cli:main"

[tool.setuptools.packages.find]
include = ["drone_sensor_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
